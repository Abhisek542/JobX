<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jobx</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /* Apply the stored theme before first paint so a dark-mode user never gets
       a white flash while Angular boots. ThemeService takes over after that. */
    (function () {
      try {
        var stored = localStorage.getItem('jobx-theme');
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
