# Crawler benchmark floors (CrawlerBenchmarkTest).
#
# First baseline, 2026-11-01, 19 sites (7 static listings, 1 rendered listing,
# 4 "no openings" pages incl. 1 rendered, 7 noise pages incl. 1 rendered):
#   precision 1.000 (460 of 460 extracted items are real jobs)
#   recall    0.996 (460 of 462 real jobs found; both misses are on
#             weworkremotely: a "Join our ..." title and a 17-word title)
#
# Floors sit one point under that so a re-captured snapshot isn't a red build
# by itself. Raise them as the extractor improves; lowering one needs an
# explanation in the PR. Plan target: precision >= 0.95, recall >= 0.85.
bench.min-precision=0.99
bench.min-recall=0.99
