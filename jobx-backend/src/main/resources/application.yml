spring:
  application:
    name: jobx-backend

  profiles:
    # Local runs are 'dev' unless a profile is set explicitly. dev enables the
    # /dev/** tooling and the committed JWT-secret fallback; any other profile
    # refuses to start without a real JOBX_JWT_SECRET (see JwtService).
    default: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/jobx
    username: jobx
    password: jobx
    driver-class-name: org.postgresql.Driver
    hikari:
      # Stated rather than left implicit: ten is the whole budget, and it is the
      # number that made BUG_REPORT #6 bite — ten concurrent add-company resolves
      # each holding a connection across a ~20s outbound call stalled everything.
      maximum-pool-size: 10
      # The tripwire for that bug coming back. Any connection held longer than
      # this logs a stack trace naming the holder, so "a transaction wrapped an
      # HTTP call again" is loud instead of silent. If a Bosch-sized persist
      # legitimately trips it, raise this to 30000 rather than removing it — a
      # write transaction over ten seconds is itself worth seeing.
      leak-detection-threshold: 10000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema, Hibernate just validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          # Half of the BUG_REPORT #6 fix, and the half that is invisible in the
          # code. Spring's Hibernate adapter defaults to a HOLD handling mode:
          # the session takes a connection at its first query and keeps it until
          # the session closes. open-in-view is on (GET /matches needs it for
          # lazy job.company), so "the session" means the whole request — which
          # made dropping @Transactional from CompanyResolver.resolve do nothing
          # at all. The first catalog query still pinned a connection for the
          # whole 15s resolve; the Hikari leak detector below is what caught it.
          #
          # RELEASE_AFTER_TRANSACTION hands the connection back after each
          # transaction, and after each statement when there is no transaction,
          # so a request only holds one while it is actually using the database.
          # Lazy loading through open-in-view still works: the session reacquires.
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

  flyway:
    enabled: true
    locations: classpath:db/migration

jobx:
  fetch:
    interval-ms: 1800000    # 30 minutes — override to 60000 for local dev testing
    manual-cooldown-ms: 300000   # 5 min between manual "Check now" fetches per company
  retention:
    # Jobx is about applying before the aggregators pick a role up. Past this
    # window that race is lost, so the posting is deleted and tombstoned (the
    # tombstone is what stops the next fetch re-adding it — see V5__job_ttl.sql).
    # Clock is the ATS's own posting date, falling back to first_seen_at.
    job-ttl-days: 6
    sweep-interval-ms: 86400000   # daily
  http:
    # Timeouts for outbound ATS calls. Without these a board that accepts the
    # connection and never replies parks the scheduler thread forever and no
    # later company is ever polled again.
    connect-timeout-ms: 10000
    response-timeout-ms: 60000   # generous: a full Greenhouse board is MBs of JSON
  resolve:
    # Add-company resolution: turning a company name, a website or a careers link
    # into an ATS platform + board token, so users never have to know either.
    #
    # These timeouts are much tighter than jobx.http.* above because a person is
    # waiting on the response, and because the URL being fetched was chosen by
    # whoever is typing rather than by us.
    connect-timeout-ms: 5000
    response-timeout-ms: 10000
    # Slug probing fans out across platforms x spellings, so the wall-clock
    # budget -- not the per-request timeout -- is what bounds how long an add
    # can take. Probes run in parallel on their own pool; every fetcher blocks.
    probe-threads: 8
    probe-budget-ms: 9000
    max-slug-candidates: 4
    # Tokens recently proven not to be boards, remembered so a user refining a
    # search doesn't re-spend an ATS vendor's rate limit on the same near-miss.
    probe-miss-ttl-ms: 120000
    max-sniffed-boards: 3
    catalog-page-size: 8
    rate-limit:
      # Resolution makes outbound requests on the user's behalf, so it gets its
      # own budget rather than riding the auth limiter's.
      max-attempts: 20
      window-seconds: 60
  cors:
    # Origins allowed to call this API from a browser. The Angular dev server is
    # the dev default; add the deployed dashboard origin per environment.
    # Explicit list only — never "*".
    allowed-origins: ${JOBX_CORS_ORIGINS:http://localhost:4200}
  jwt:
    # Real deployments MUST set JOBX_JWT_SECRET via env var — never commit a real
    # secret. The fallback only works under the 'dev' profile; JwtService fails
    # startup with it anywhere else. Keep the value in sync with JwtService.DEV_ONLY_SECRET.
    secret: ${JOBX_JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes}
    expiration-ms: 604800000   # 7 days
  auth:
    rate-limit:
      max-attempts: 10     # per IP per /auth/* endpoint per window
      window-seconds: 60

logging:
  level:
    com.jobx: DEBUG
    org.springframework.web.reactive: INFO
